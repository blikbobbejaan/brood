name: Nightly

# CI answers "did this commit pass?" — once. It cannot answer the question CLAUDE.md
# actually asks, which is "is this tree green?", because a one-in-N race passes N-1 runs
# out of N and a single pass is not evidence. Everything here is the repetition and the
# armed tripwires that a per-push gate cannot afford to run.
#
# The class this exists for, concretely: KI-103 was a check-then-act race on the mailbox
# overflow flag. Both engines were already covered per push (CI's `test` and
# `differential` jobs), the breakage suite was already green, and none of it mattered —
# the failure needed a particular interleaving, so it showed up as an intermittent red
# that looked like a flaky test and was filed as "not reproducible" for a fortnight.
#
# Nightly, not per-push, deliberately: these are minutes-expensive and their findings are
# rarely attributable to one commit anyway. A red here is a bug hunt, not a bisect.

on:
  schedule:
    # 03:00 UTC — after the day's pushes, before the next morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Unlike CI's, this concurrency group does NOT cancel in progress: a nightly that is
# cancelled by a manual dispatch has told nobody anything, and the whole value here is
# in runs that actually finish.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # A one-in-N race needs N runs. Three independent runners rather than three serial
  # iterations, so wall-clock stays one suite and a single red run is still legible.
  repeat:
    name: suite, run ${{ matrix.run }} of 3
    runs-on: ubuntu-latest
    strategy:
      # Every run finishes: "runs 1 and 3 passed, 2 failed" is the actual finding, and
      # fail-fast would throw away the frequency, which is the most useful thing a flake
      # tells you.
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest

      # Identical to CI's `test` step on purpose. A nightly that runs a DIFFERENT command
      # from the per-push gate cannot tell a flake from a configuration difference.
      - name: Test (nextest)
        run: cargo nextest run --no-fail-fast --features brood/treesit-grammars

  # `make gcstress` runs nowhere else: GC_STRESS collects at every safepoint, so a handle
  # held across a collection is caught every time rather than when a threshold collection
  # happens to land in the window (KI-57). The target builds DEBUG on purpose.
  gcstress:
    name: GC stress + verify (concurrency and mailbox tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make gcstress
        run: make gcstress

      # The target writes a per-file log and prints only the first few lines of a
      # failure; keep the whole thing, because a use-after-GC report is a path through
      # the heap graph and the interesting part is rarely in the first five lines.
      - name: Upload the stress logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcstress-logs
          path: /tmp/gcstress.*.log
          if-no-files-found: warn

  # The manual gates. A gate nobody runs reports nothing, so these rotted silently for
  # weeks when they were run only by hand; nightly turns "broken for weeks" into
  # "broken for a day".
  stress:
    name: stress suite (fuzz differential, scaling, property/race, 3 engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `stress/run.sh` wants the debug-assertions release binary its harnesses assume.
      - name: Build (release, debug-assertions armed)
        run: RUSTFLAGS="-C debug-assertions=on" cargo build --release -p cli

      # The scaling arm SKIPS itself under 8 cores (GitHub's runners are 2-4), so this is
      # the fuzz differential, the property/race corpus and the checker-soundness corpus.
      # That is the half that caught the stale generator; the scaling half stays local.
      - name: make stress
        run: ./stress/run.sh

      - name: Upload divergent seeds (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-fuzz-seeds
          path: stress/fuzz_out/
          if-no-files-found: warn

  # The `perf-stats` feature compiles counter increments into the VM/JIT hot paths
  # (vm_run_bc, deopt, the JIT call lowering, the background compiler). No other job
  # builds it, so a cfg'd seam there could rot — or a counter could perturb an engine —
  # unnoticed. A targeted set: the JIT and engine-differential binaries, which drive
  # exactly those paths, plus the in-language perf triage tests on a counter-armed brood
  # (where `perf/report` must report real counters, not its no-data branch).
  perf-stats:
    name: perf-stats build (JIT + differential + perf triage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Test (nextest, --features brood/perf-stats, targeted)
        run: >-
          cargo nextest run -p brood --features brood/perf-stats --no-fail-fast
          -E 'binary(jit) | binary(differential) | binary(jit_suspend_latch) | binary(jit_tier_frame_pairing)'

      - name: perf triage tests on a counter-armed brood
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p cli --features brood/perf-stats
          target/debug/brood --test tests/perf_test.blsp
          # The counters must actually be compiled in and dumped: a perf-stats build that
          # prints the "counters not compiled in" hint is the failure this job exists for.
          echo '(io/puts (fold (range 1000) 0 (fn (total x) (+ total x))))' > perf-smoke.blsp
          out=$(BROOD_PERF_STATS=1 target/debug/brood perf-smoke.blsp 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '\[vm-perf\] +vm_apply +[1-9]' \
            || { echo "::error::BROOD_PERF_STATS dumped no non-zero vm_apply counter"; exit 1; }

  # ASAN over the kernel-exercising tests: genuine OOB / use-after-free in the unsafe
  # substrate (the mmap table, the JIT codegen buffers) that TSAN and the logical GC
  # tripwires cannot see.
  #
  # Runs EVERYTHING, with a long timeout rather than a skip filter. The `jit` binary's
  # cases warm the JIT with real iteration counts and take many minutes under
  # instrumentation, so the temptation is to filter them out — but the obvious filter
  # (`--skip jit_`) matches none of them (they are named `..._under_jit`), which would be a
  # no-op that reads exactly like a working exclusion. A slow nightly job is honest; a
  # filter that silently skips nothing is the failure mode this whole section exists for.
  asan:
    name: AddressSanitizer (kernel tests)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make asan
        run: make asan

  # ThreadSanitizer and the loom model check. Both are fast; they are here rather than in
  # CI only because they need a nightly toolchain.
  tsan-loom:
    name: ThreadSanitizer + loom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make tsan
        run: make tsan

      - name: make loom
        run: make loom
