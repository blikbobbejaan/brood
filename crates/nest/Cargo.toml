[package]
name = "nest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Brood project tooling — scaffolding, test discovery, user config."

[[bin]]
name = "nest"
path = "src/main.rs"

[dependencies]
brood = { path = "../lisp" }
# Argument parsing + help text + subcommand routing. See the matching note
# in crates/cli/Cargo.toml — `nest` has more surface (run/test/check/format/
# new/doc/mcp/repl), so the win from derive-based subcommands is bigger.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# `tests/mcp.rs` reads the server's JSON-RPC replies.
serde_json = "1"

[features]
# Mirror cli's passthrough: `cargo build -p nest --features perf-stats` arms the
# VM work-attribution counters (`(vm-stats)` / `BROOD_PERF_STATS`) for profiling a
# real project workload (e.g. bedit redisplay) through `nest test`/`run`.
# Off by default — zero cost.
perf-stats = ["brood/perf-stats"]
# (No `jit` passthrough: nest depends on brood with default features, which now
# include `jit`, so the JIT is already on. A lean `--no-default-features` release
# re-adds it with `--features brood/jit` directly — see the Makefile's JIT_FEATURES.)

[lints]
workspace = true
