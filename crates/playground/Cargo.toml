[package]
name = "brood-playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "wasm-bindgen shim exposing a Brood eval() to the browser (the in-browser playground)."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The interpreter, built for wasm32 with no native subsystems (see crates/lisp's
# wasm target sections). default-features drops dev-tools/jit/treesit/wasmtime; the
# playground keeps the checker, brotli, every image codec and the toolchain modules a
# visitor's snippet may reach.
brood = { path = "../lisp", default-features = false, features = ["brotli", "checker", "image-formats", "toolchain"] }
# Pinned to the installed wasm-bindgen CLI — the crate and CLI versions must match.
wasm-bindgen = "=0.2.130"

# NOTE: no `[profile.*]` here, deliberately. `brood-playground` is a workspace *member*,
# and cargo ignores a non-root package's profiles — it said so on every build of the
# workspace. This crate used to carry `opt-level = "s"` + `lto = true` to shrink the wasm
# and neither ever applied. Those settings now live at the workspace root as
# `[profile.release-wasm]`; build this crate with `--profile release-wasm`.

[lints]
workspace = true
